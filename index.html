<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio_samba</title>
    <link rel="stylesheet" href="style-progress.css">
    <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-tHVz32aR8G87v9Md17c3Z.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>
  <!-- Rideau en fond video ; le rideau CSS dessous sert de repli -->
  <div class="curtain-video" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="curtain.mp4" type="video/mp4">
    </video>
  </div>
  <a class="cv-button" href="Resume_Samba_Hama_TRAORE_Data_Engineer.pdf" download>Download CV</a>
  <div class="cv-preview">
    <iframe src="Resume_Samba_Hama_TRAORE_Data_Engineer.pdf" title="CV"></iframe>
  </div>
  <section class="dots">
      <div class="dots-row">
        <h1>In construction... &nbsp; Come back later</h1>
        <div class="loader">
          <div class="loading one"></div>
          <div class="loading two"></div>
          <div class="loading three"></div>
        </div>
      </div>
      <a class="preview-button" href="https://tsamh.github.io/" target="_blank" rel="noopener">Voir apercu</a>
      </section>

  <script>
    const cvButton = document.querySelector('.cv-button');
    const cvPreview = document.querySelector('.cv-preview');

    // 1er clic : on affiche le CV. 2e clic : le telechargement se fait normalement.
    cvButton.addEventListener('click', (event) => {
      if (!cvPreview.classList.contains('open')) {
        event.preventDefault();
        cvPreview.classList.add('open');
        cvButton.textContent = 'Download';
      }
    });

    // Clic en dehors du CV : on ferme l'apercu.
    cvPreview.addEventListener('click', (event) => {
      if (event.target === cvPreview) {
        cvPreview.classList.remove('open');
        cvButton.textContent = 'Download CV';
      }
    });
  </script>
</body>
</html>
